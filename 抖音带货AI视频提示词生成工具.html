<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音带货 AI 视频提示词生成器</title>
<style>
  :root {
    --primary: #FF3B5C;
    --primary-dark: #E0264A;
    --primary-light: #FF6B84;
    --accent: #FE2C55;
    --bg: #0F0F0F;
    --surface: #1A1A1A;
    --surface2: #242424;
    --surface3: #2E2E2E;
    --border: #3A3A3A;
    --text: #F0F0F0;
    --text2: #A0A0A0;
    --text3: #606060;
    --green: #25F4EE;
    --yellow: #FFD700;
    --purple: #B14FEB;
    --blue: #3A86FF;
    --success: #00D26A;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1A0A0E 0%, #0F0F0F 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 0;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo-text { font-size: 18px; font-weight: 700; }
  .logo-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .header-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--text2); }
  .header-badge span { color: var(--primary); font-weight: 600; }

  /* ── Layout ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 420px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

  /* ── Card ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .card-title { font-size: 14px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .card-title::before { content: ''; display: block; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; }

  /* ── Form ── */
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  .label-required::after { content: ' *'; color: var(--primary); }
  input[type="text"], textarea, select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text);
    font-size: 14px; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,59,92,0.15);
  }
  textarea { resize: vertical; min-height: 80px; }
  select { cursor: pointer; }
  select option { background: var(--surface2); }
  .input-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* ── Tag Chips ── */
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { padding: 4px 10px; background: var(--surface3); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text2); cursor: pointer; transition: all 0.2s; user-select: none; }
  .chip:hover { border-color: var(--primary-light); color: var(--primary-light); }
  .chip.active { background: rgba(255,59,92,0.15); border-color: var(--primary); color: var(--primary); }

  /* ── Slider ── */
  .range-row { display: flex; align-items: center; gap: 12px; }
  input[type="range"] { flex: 1; accent-color: var(--primary); }
  .range-val { min-width: 48px; text-align: center; font-size: 13px; font-weight: 700; color: var(--primary); }

  /* ── Section divider ── */
  .section-divider { margin: 20px 0; border: none; border-top: 1px solid var(--border); }

  /* ── Generate Button ── */
  .btn-generate {
    width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary) 0%, #FF6B2B 100%);
    border: none; border-radius: var(--radius-sm); color: white; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; letter-spacing: 0.03em;
    box-shadow: 0 4px 16px rgba(255,59,92,0.35);
  }
  .btn-generate:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(255,59,92,0.5); }
  .btn-generate:active { transform: translateY(0); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── Output Area ── */
  .output-panel { display: flex; flex-direction: column; gap: 16px; }
  .tool-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text2); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .tab-btn:hover { border-color: var(--primary-light); color: var(--text); }
  .tab-btn.active { background: rgba(255,59,92,0.15); border-color: var(--primary); color: var(--primary); }
  .tab-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; font-weight: 700; }
  .tab-badge-cn { background: rgba(37,244,238,0.15); color: var(--green); }
  .tab-badge-en { background: rgba(58,134,255,0.15); color: var(--blue); }

  /* ── Prompt Output Box ── */
  .prompt-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .prompt-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); }
  .prompt-scene-label { font-size: 12px; font-weight: 700; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .scene-badge { display: inline-flex; align-items: center; gap: 4px; }
  .scene-dot { width: 6px; height: 6px; border-radius: 50%; }
  .btn-copy {
    display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 6px;
    background: var(--surface3); border: 1px solid var(--border); color: var(--text2);
    font-size: 12px; cursor: pointer; transition: all 0.2s;
  }
  .btn-copy:hover { border-color: var(--success); color: var(--success); }
  .btn-copy.copied { background: rgba(0,210,106,0.1); border-color: var(--success); color: var(--success); }
  .prompt-text {
    padding: 16px; font-size: 13px; line-height: 1.8; white-space: pre-wrap; word-break: break-all;
    color: var(--text); font-family: 'SF Mono', 'Courier New', monospace;
    max-height: 320px; overflow-y: auto;
  }
  .prompt-text::-webkit-scrollbar { width: 4px; }
  .prompt-text::-webkit-scrollbar-track { background: transparent; }
  .prompt-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Syntax highlight */
  .hl-time { color: var(--yellow); font-weight: 700; }
  .hl-shot { color: var(--green); font-weight: 700; }
  .hl-action { color: var(--primary-light); }
  .hl-style { color: var(--purple); }
  .hl-param { color: var(--blue); }
  .hl-label { color: var(--text2); font-weight: 700; }
  .hl-negative { color: #FF6B6B; }

  /* ── Copy All Button ── */
  .btn-copy-all {
    width: 100%; padding: 12px; background: var(--surface2); border: 1px dashed var(--border);
    border-radius: var(--radius-sm); color: var(--text2); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-copy-all:hover { border-color: var(--primary); color: var(--primary); background: rgba(255,59,92,0.05); }

  /* ── Tips ── */
  .tips-card { background: rgba(37,244,238,0.04); border: 1px solid rgba(37,244,238,0.15); border-radius: var(--radius); padding: 16px; }
  .tips-title { font-size: 12px; font-weight: 700; color: var(--green); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .tips-list { list-style: none; }
  .tips-list li { font-size: 12px; color: var(--text2); padding: 3px 0; padding-left: 14px; position: relative; }
  .tips-list li::before { content: '›'; position: absolute; left: 0; color: var(--green); font-weight: 700; }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-text { color: var(--text3); font-size: 14px; }

  /* ── Spinner ── */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Progress bar ── */
  .progress { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 8px; display: none; }
  .progress-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
  .progress-bar { height: 4px; background: var(--surface3); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--green)); border-radius: 4px; transition: width 0.3s; }

  /* ── Scene cards (output) ── */
  .scenes-wrapper { display: flex; flex-direction: column; gap: 12px; }

  /* ── Scrollable ── */
  .output-scroll { max-height: calc(100vh - 120px); overflow-y: auto; }
  .output-scroll::-webkit-scrollbar { width: 4px; }
  .output-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── AI Optimize ── */
  .field-with-ai { position: relative; }
  .btn-ai-opt {
    position: absolute; right: 8px; top: 8px;
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(177,79,235,0.5);
    background: rgba(177,79,235,0.1); color: var(--purple);
    font-size: 11px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; z-index: 2; white-space: nowrap;
  }
  .btn-ai-opt:hover { background: rgba(177,79,235,0.2); border-color: var(--purple); }
  .btn-ai-opt:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ai-opt .ai-icon { font-size: 13px; }
  .ai-loading { display: none; }
  .ai-loading.show { display: inline-block; }

  /* optimized result panel */
  .ai-result-panel {
    margin-top: 8px; background: rgba(177,79,235,0.06);
    border: 1px solid rgba(177,79,235,0.25); border-radius: var(--radius-sm);
    overflow: hidden; display: none;
  }
  .ai-result-panel.show { display: block; }
  .ai-result-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; background: rgba(177,79,235,0.1);
    border-bottom: 1px solid rgba(177,79,235,0.2);
  }
  .ai-result-title { font-size: 11px; font-weight: 700; color: var(--purple); display: flex; align-items: center; gap: 5px; }
  .ai-result-actions { display: flex; gap: 6px; }
  .btn-apply {
    padding: 3px 10px; border-radius: 5px; border: 1px solid rgba(0,210,106,0.4);
    background: rgba(0,210,106,0.1); color: var(--success);
    font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .btn-apply:hover { background: rgba(0,210,106,0.2); }
  .btn-discard {
    padding: 3px 10px; border-radius: 5px; border: 1px solid var(--border);
    background: transparent; color: var(--text3);
    font-size: 11px; cursor: pointer; transition: all 0.2s;
  }
  .btn-discard:hover { color: var(--text2); }
  .ai-result-content {
    padding: 10px 12px; font-size: 12px; line-height: 1.75; color: var(--text);
    white-space: pre-wrap; max-height: 200px; overflow-y: auto;
  }
  .ai-result-content::-webkit-scrollbar { width: 3px; }
  .ai-result-content::-webkit-scrollbar-thumb { background: rgba(177,79,235,0.3); border-radius: 3px; }

  /* dynamic chips */
  .chip.ai-suggested {
    background: rgba(177,79,235,0.1); border-color: rgba(177,79,235,0.4); color: var(--purple);
    animation: chipFadeIn 0.3s ease;
  }
  @keyframes chipFadeIn { from { opacity:0; transform: scale(0.8); } to { opacity:1; transform: scale(1); } }
  .chips-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; margin-top: 8px; }

  /* textarea padding for button */
  textarea.has-ai-btn { padding-right: 90px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <div>
        <div class="logo-text">抖音带货 AI 视频提示词生成器</div>
        <div class="logo-sub">支持可灵AI · 即梦AI · Kling国际版</div>
      </div>
    </div>
    <div class="header-badge">带货黄金公式 <span>5段式结构</span></div>
  </div>
</div>

<div class="container">

  <!-- ─── 左侧：输入面板 ─── -->
  <div>
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">产品基础信息</div>

      <div class="form-group">
        <label class="label-required">产品名称</label>
        <input type="text" id="productName" placeholder="例：沫檬地板清洁液、飞达手工面包">
      </div>

      <div class="form-group">
        <label class="label-required">产品品类</label>
        <select id="category" onchange="updateCategoryHints()">
          <option value="">— 请选择 —</option>
          <optgroup label="居家清洁">
            <option value="floor_cleaner">地板/多功能清洁液</option>
            <option value="shoe_cleaner">鞋类清洁剂</option>
            <option value="kitchen_cleaner">厨房清洁剂</option>
            <option value="laundry">洗衣液/柔顺剂</option>
          </optgroup>
          <optgroup label="食品烘焙">
            <option value="bread">手工面包/烘焙</option>
            <option value="snack">零食/坚果/果干</option>
            <option value="beverage">饮料/茶饮</option>
            <option value="sauce">调味料/酱料</option>
          </optgroup>
          <optgroup label="美妆护肤">
            <option value="skincare">护肤品</option>
            <option value="makeup">彩妆</option>
            <option value="haircare">发型/护发</option>
          </optgroup>
          <optgroup label="服装配饰">
            <option value="clothing">服装/鞋靴</option>
            <option value="bag">包包/配饰</option>
          </optgroup>
          <optgroup label="母婴宠物">
            <option value="baby">母婴用品</option>
            <option value="pet">宠物用品</option>
          </optgroup>
          <optgroup label="数码家电">
            <option value="tech">数码/科技产品</option>
            <option value="home_appliance">家电</option>
          </optgroup>
          <option value="other">其他品类</option>
        </select>
      </div>

      <div class="form-group">
        <label class="label-required">核心卖点（最多3个）</label>
        <div class="field-with-ai">
          <textarea id="sellingPoints" class="has-ai-btn" rows="3"
            placeholder="例：&#10;1. 去污力强，3秒轻松去除顽固污渍&#10;2. 温和无刺激，婴儿友好配方&#10;3. 留香持久，清洁后留有淡淡薰衣草香"
            oninput="onSellingPointsInput()"></textarea>
          <button class="btn-ai-opt" id="aiOptSP" onclick="aiOptimize('sp')" title="AI优化卖点话术">
            <span class="ai-icon">✦</span>
            <span class="ai-opt-label">AI优化</span>
            <span class="spinner ai-loading" id="spSpinner"></span>
          </button>
        </div>
        <div class="ai-result-panel" id="spResultPanel">
          <div class="ai-result-header">
            <div class="ai-result-title">✦ AI优化结果 · 核心卖点</div>
            <div class="ai-result-actions">
              <button class="btn-apply" onclick="applyResult('sp')">应用</button>
              <button class="btn-discard" onclick="discardResult('sp')">丢弃</button>
            </div>
          </div>
          <div class="ai-result-content" id="spResultContent"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="label-required">用户痛点场景</label>
        <div class="field-with-ai">
          <textarea id="painPoints" class="has-ai-btn" rows="2"
            placeholder="例：白色球鞋放久了发黄，用普通清洁剂擦完还是有污渍，颜面尽失"
            oninput="onPainPointsInput()"></textarea>
          <button class="btn-ai-opt" id="aiOptPain" onclick="aiOptimize('pain')" title="AI优化痛点描述">
            <span class="ai-icon">✦</span>
            <span class="ai-opt-label">AI优化</span>
            <span class="spinner ai-loading" id="painSpinner"></span>
          </button>
        </div>
        <div class="ai-result-panel" id="painResultPanel">
          <div class="ai-result-header">
            <div class="ai-result-title">✦ AI优化结果 · 痛点场景</div>
            <div class="ai-result-actions">
              <button class="btn-apply" onclick="applyResult('pain')">应用</button>
              <button class="btn-discard" onclick="discardResult('pain')">丢弃</button>
            </div>
          </div>
          <div class="ai-result-content" id="painResultContent"></div>
        </div>
        <div id="painChipsWrap">
          <div class="chips-label" id="painChipsLabel" style="display:none">快速选择 · 点击追加到输入框</div>
          <div class="chip-group" id="painChips"></div>
        </div>
      </div>

      <div class="form-group">
        <label>目标人群</label>
        <div class="chip-group">
          <span class="chip" onclick="toggleChip(this,'audience')">18-25岁女生</span>
          <span class="chip" onclick="toggleChip(this,'audience')">25-35岁宝妈</span>
          <span class="chip" onclick="toggleChip(this,'audience')">职场白领</span>
          <span class="chip" onclick="toggleChip(this,'audience')">学生党</span>
          <span class="chip" onclick="toggleChip(this,'audience')">居家达人</span>
          <span class="chip" onclick="toggleChip(this,'audience')">精致男士</span>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">视频风格设置</div>

      <div class="form-group">
        <label>视频风格</label>
        <div class="chip-group" id="styleChips">
          <span class="chip active" onclick="toggleChip(this,'style')">素人真实感</span>
          <span class="chip" onclick="toggleChip(this,'style')">小红书清新</span>
          <span class="chip" onclick="toggleChip(this,'style')">专业测评</span>
          <span class="chip" onclick="toggleChip(this,'style')">剧情反转</span>
          <span class="chip" onclick="toggleChip(this,'style')">极简高端</span>
          <span class="chip" onclick="toggleChip(this,'style')">搞笑幽默</span>
        </div>
      </div>

      <div class="form-group">
        <label>色调偏好</label>
        <div class="chip-group" id="toneChips">
          <span class="chip active" onclick="toggleChip(this,'tone')">暖奶油调</span>
          <span class="chip" onclick="toggleChip(this,'tone')">清冷莫兰迪</span>
          <span class="chip" onclick="toggleChip(this,'tone')">明亮饱和</span>
          <span class="chip" onclick="toggleChip(this,'tone')">自然无滤镜</span>
          <span class="chip" onclick="toggleChip(this,'tone')">深邃科技蓝</span>
        </div>
      </div>

      <div class="form-group">
        <label>视频时长</label>
        <div class="range-row">
          <input type="range" id="durationRange" min="10" max="60" step="5" value="30" oninput="document.getElementById('durationVal').textContent=this.value+'s'">
          <div class="range-val" id="durationVal">30s</div>
        </div>
        <div class="input-hint" style="margin-top:4px">建议带货视频15-45秒效果最佳</div>
      </div>

      <div class="form-group">
        <label>分镜数量</label>
        <div class="range-row">
          <input type="range" id="sceneCount" min="3" max="8" step="1" value="5" oninput="document.getElementById('sceneVal').textContent=this.value+'个分镜'">
          <div class="range-val" id="sceneVal">5个分镜</div>
        </div>
      </div>

      <div class="form-group">
        <label>特殊要求（可选）</label>
        <input type="text" id="special" placeholder="例：必须包含前后对比、需要手部特写镜头">
      </div>
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generatePrompts()">
      生成 AI 视频提示词
    </button>
  </div>

  <!-- ─── 右侧：输出面板 ─── -->
  <div class="output-scroll">
    <div class="output-panel" id="outputPanel">

// ── 核心AI优化函数（本地引擎）──
function aiOptimizeSP(rawText, productName, category) {
  const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return null;

  const optimized = lines.map((line, idx) => {
    // 去掉序号前缀
    const clean = line.replace(/^[\d\.\s、]+/, '').trim();
    if (!clean) return null;

    // 尝试匹配增强词库
    let enhanced = null;
    for (const [kw, variants] of Object.entries(SP_ENHANCE)) {
      if (clean.includes(kw)) {
        enhanced = variants[idx % variants.length];
        break;
      }
    }

    if (enhanced) {
      return `${idx + 1}. ${enhanced}`;
    }

    // 通用增强：加数字量化 + 情绪动词
    const quantifiers = ['实测', '亲测', '实测对比', '数据说话'];
    const emotions = ['震惊到不行', '好用到哭', '用完直接回购', '家人都抢着用'];
    const q = quantifiers[idx % quantifiers.length];
    const e = emotions[idx % emotions.length];
    return `${idx + 1}. ${q}：${clean}，${e}`;
  }).filter(Boolean);

  // 加上通用收尾句
  optimized.push(`✓ 限时特惠，下单享88折 + 赠品，库存不多`);

  return optimized.join('\n');
}

function aiOptimizePain(rawText, productName, category) {
  if (!rawText.trim()) return null;
  const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
  const optimized = [];

  lines.forEach((line, idx) => {
    const clean = line.replace(/^[\d\.\s、]+/, '').trim();
    if (!clean) return;

    // 选模板
    const tmpl = PAIN_UPGRADE.templates[idx % PAIN_UPGRADE.templates.length];
    let base = tmpl(clean);

    // 场景词强化
    for (const [kw, scenes] of Object.entries(PAIN_UPGRADE.scene_words)) {
      if (clean.includes(kw)) {
        base += `\n   → 很多人的真实经历：${scenes[idx % scenes.length]}`;
        break;
      }
    }

    optimized.push(base);
  });

  if (!optimized.length) return null;

  // 拼接成视频脚本式痛点
  return optimized.join('\n\n') +
    `\n\n→ 视频开头建议：直接展示「${lines[0]}」的真实画面，不加任何说明，让观众瞬间代入。`;
}

  const combined = (spText + ' ' + painText).toLowerCase();
  const catHints = CATEGORY_PAIN_HINTS[category] || [];

  // 关键词匹配
  const matched = new Set();
  KEYWORD_PAIN_MAP.forEach(({ keywords, suggestions }) => {
    if (keywords.some(kw => combined.includes(kw))) {
      suggestions.forEach(s => matched.add(s));
    }
  });

  // 品类默认 hints
  catHints.forEach(h => matched.add(h));

  return [...matched].slice(0, 8);
}

let _aiResults = { sp: null, pain: null };
let _debounceTimer = null;

function aiOptimize(type) {
  const productName = document.getElementById('productName').value.trim();
  const category = document.getElementById('category').value;

  if (type === 'sp') {
    const raw = document.getElementById('sellingPoints').value.trim();
    if (!raw) { showToast('请先输入核心卖点'); return; }
    const btn = document.getElementById('aiOptSP');
    const spinner = document.getElementById('spSpinner');
    runAiAnimation(btn, spinner, () => {
      const result = aiOptimizeSP(raw, productName, category);
      _aiResults.sp = result;
      showAiResult('sp', result);
    });
  } else {
    const raw = document.getElementById('painPoints').value.trim();
    if (!raw) { showToast('请先输入用户痛点'); return; }
    const btn = document.getElementById('aiOptPain');
    const spinner = document.getElementById('painSpinner');
    runAiAnimation(btn, spinner, () => {
      const result = aiOptimizePain(raw, productName, category);
      _aiResults.pain = result;
      showAiResult('pain', result);
    });
  }
}

function runAiAnimation(btn, spinner, callback) {
  btn.disabled = true;
  btn.querySelector('.ai-opt-label').textContent = '优化中...';
  spinner.classList.add('show');
  // 模拟思考时感（400-900ms随机）
  const delay = 400 + Math.random() * 500;
  setTimeout(() => {
    spinner.classList.remove('show');
    btn.querySelector('.ai-opt-label').textContent = 'AI优化';
    btn.disabled = false;
    callback();
  }, delay);
}

function showAiResult(type, result) {
  const panel = document.getElementById(type === 'sp' ? 'spResultPanel' : 'painResultPanel');
  const content = document.getElementById(type === 'sp' ? 'spResultContent' : 'painResultContent');
  if (!result) { showToast('内容已经很棒了，暂无优化建议'); return; }
  content.textContent = result;
  panel.classList.add('show');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function applyResult(type) {
  const result = _aiResults[type];
  if (!result) return;
  if (type === 'sp') {
    document.getElementById('sellingPoints').value = result;
    onSellingPointsInput();
  } else {
    document.getElementById('painPoints').value = result;
    onPainPointsInput();
  }
  discardResult(type);
  showToast('已应用优化结果 ✓');
}

function discardResult(type) {
  const panel = document.getElementById(type === 'sp' ? 'spResultPanel' : 'painResultPanel');
  panel.classList.remove('show');
}

function onPainPointsInput() {
  clearTimeout(_debounceTimer);

function refreshDynamicChips() {
  const spText = document.getElementById('sellingPoints').value;
  const painText = document.getElementById('painPoints').value;
  const category = document.getElementById('category').value;

  const suggestions = getSmartPainSuggestions(spText, painText, category);
  renderPainChips(suggestions, painText);
}

function renderPainChips(suggestions, currentPainText) {
  const container = document.getElementById('painChips');
  const label = document.getElementById('painChipsLabel');

  if (!suggestions.length) {
    container.innerHTML = '';
    label.style.display = 'none';
    return;
  }

  label.style.display = 'block';
  container.innerHTML = '';

  suggestions.forEach(s => {
    const chip = document.createElement('span');
    const isAI = !Object.values(CATEGORY_PAIN_HINTS).flat().includes(s);
    chip.className = 'chip' + (isAI ? ' ai-suggested' : '');
    chip.textContent = s;
    // 已在输入框中的标记为 active
    if (currentPainText.includes(s)) chip.classList.add('active');
    chip.onclick = function() {
      const ta = document.getElementById('painPoints');
      if (!ta.value.includes(s)) {
        ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + s;
        chip.classList.add('active');
      }
      refreshDynamicChips();
    };
    container.appendChild(chip);
  });
}

function toggleChip(el, group) {
  const siblings = el.parentNode.querySelectorAll('.chip');
  const singleGroups = ['style', 'tone'];
  if (singleGroups.includes(group)) {
    siblings.forEach(c => c.classList.remove('active'));

  }
}

  const allChips = document.querySelectorAll('.chip');
  return Array.from(allChips).filter(c => {

    return onclick.includes(`'${group}'`) && c.classList.contains('active');
  }).map(c => c.textContent.trim());
}

function buildTimings(duration, sceneCount) {
  const ratios = sceneCount === 3 ? [0.15, 0.50, 0.35] :
                 sceneCount === 4 ? [0.12, 0.35, 0.35, 0.18] :
                 sceneCount === 5 ? [0.10, 0.25, 0.35, 0.20, 0.10] :
                 sceneCount === 6 ? [0.08, 0.20, 0.28, 0.22, 0.12, 0.10] :
                 [0.08, 0.18, 0.22, 0.22, 0.15, 0.08, 0.07];
  const timings = [];
  let cur = 0;
  ratios.forEach((r, i) => {
    const len = Math.round(duration * r);
    const end = i === ratios.length - 1 ? duration : cur + len;
    timings.push({ start: cur, end });
    cur = end;
  });
  return timings;
}

  3: ['情绪钩子', '产品演示', '效果收尾'],

function buildScenes(category, productName, sellingPoints, painPoints, sceneCount) {
  const catScenes = CATEGORY_SCENES[category] || DEFAULT_SCENES;
  const sp = sellingPoints.split('\n').filter(s => s.trim()).slice(0, 3);
  const pp = painPoints.split('\n').filter(p => p.trim()).slice(0, 2);

  const sceneTypeMap = {
    3: ['hook', 'demo', 'cta'],
    4: ['hook', 'pain', 'demo', 'cta'],
    5: ['hook', 'pain', 'demo', 'proof', 'cta'],
    6: ['hook', 'pain', 'intro', 'demo', 'proof', 'cta'],
    7: ['hook', 'pain', 'error_demo', 'intro', 'demo', 'proof', 'cta'],
    8: ['hook', 'pain', 'error_demo', 'intro', 'demo', 'multi_proof', 'proof', 'cta']
  };

  const types = sceneTypeMap[sceneCount] || sceneTypeMap[5];
  return types.map(type => ({
    type,
    desc_zh: getSceneDesc(type, catScenes, productName, sp, pp),
    desc_en: getSceneDescEn(type, productName, sp, pp)
  }));
}

function getSceneDesc(type, catScenes, productName, sp, pp) {
  const descs = {
    hook: catScenes.hook || `${productName}最震撼的细节特写，必须在前2秒内抓住眼球`,
    pain: pp[0] ? `场景复现：${pp[0].replace(/^[\d\.\s、→✓]+/, '').split('，')[0]}，主角神情沮丧，环境凌乱` : (catScenes.pain || '痛点场景展示，引发用户强烈共鸣'),

    intro: `${productName}产品正面展示，包装特写，品牌名称清晰入画`,
    demo: sp[0] ? `核心演示：${sp[0].replace(/^[\d\.\s、✓→]+/, '').split('，')[0]}，${catScenes.demo || '操作过程真实自然'}` : (catScenes.demo || `${productName}使用过程完整演示`),
    multi_proof: sp[1] ? `多场景验证：${sp[1].replace(/^[\d\.\s、✓→]+/, '').split('，')[0]}，进一步证实产品实力` : '多角度验证产品效果',

    cta: catScenes.cta || `满意结果全景+产品标识露出，引导关注/购买`

function getSceneDescEn(type, productName, sp, pp) {
  const cleanSP = (s) => s ? s.replace(/^[\d\.\s、✓→]+/, '').split('，')[0] : '';
  const cleanPP = (p) => p ? p.replace(/^[\d\.\s、✓→]+/, '').split('，')[0] : '';

    pain: pp[0] ? `Problem scenario: ${cleanPP(pp[0])}, frustrated expression, messy environment` : `User pain point scenario, strong emotional resonance`,

    intro: `${productName} product front view, packaging close-up, brand name clearly visible`,

function highlightSyntax(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/(\d+s\s*-\s*\d+s)/g, '<span class="hl-time">$1</span>')
    .replace(/(【[^】]+】)/g, '<span class="hl-label">$1</span>')
    .replace(/(Shot \d+[^\n]*)/g, '<span class="hl-shot">$1</span>')
    .replace(/(--[\w]+\s+[\w]+)/g, '<span class="hl-param">$1</span>')
    .replace(/(--negative:[^\n]+)/g, '<span class="hl-negative">$1</span>')
    .replace(/(--no [^\n]+)/g, '<span class="hl-negative">$1</span>')
    .replace(/(【禁止生成】[^\n]+)/g, '<span class="hl-negative">$1</span>')
    .replace(/(\[\w+[^\]]*\])/g, '<span class="hl-style">$1</span>');
}

function copyText(btn, id) {
  const text = window._currentFullPrompt || '';
  navigator.clipboard.writeText(text).then(() => {
    const span = btn.querySelector('span');
    span.textContent = '✓ 已复制';
    btn.classList.add('copied');
    setTimeout(() => { span.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    const span = btn.querySelector('span');
    span.textContent = '✓ 已复制';
    setTimeout(() => { span.textContent = '复制'; }, 2000);
  });
}

function copyAll() {
  const d = window._generatedData;
  if (!d) return;
  const kl = buildKlingPrompt(d);
  const jm = buildJimengPrompt(d);
  const en = buildKlingEngPrompt(d);
  const text = `========== 可灵AI版 ==========\n${kl}\n\n========== 即梦AI版 ==========\n${jm}\n\n========== Kling英文版 ==========\n${en}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy-all');
    btn.textContent = '✓ 已复制全部提示词！';
    setTimeout(() => { btn.textContent = '📋 一键复制全部提示词'; }, 3000);
  });
}
</script>
